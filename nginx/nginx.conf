worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;

    # Default Docker DNS resolver — needed because per-env upstreams are
    # discovered by container name. valid=5s keeps stale routes from
    # surviving a destroy by more than a few seconds.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    log_format sandbox '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'env=$http_x_sandbox_env upstream=$upstream_addr';

    access_log /var/log/nginx/access.log sandbox;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;

        # Friendly index — handy when verifying the proxy is up before any
        # env exists.
        location = / {
            default_type text/plain;
            return 200 'sandbox-nginx is up. visit /env/<env_id>/ to reach a sandbox.\n';
        }

        # Liveness for the proxy itself (separate from any env's /health).
        location = /health {
            default_type text/plain;
            return 200 'OK\n';
        }

        # Per-env location blocks are dropped here by create_env.sh and
        # removed by destroy_env.sh. Reload after every change.
        include /etc/nginx/conf.d/*.conf;
    }
}
